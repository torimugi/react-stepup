name: Vitest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. pnpm をインストールするためのステップ
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 # 使っているpnpmのバージョンに合わせてください

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # pnpm のキャッシュを利用して高速化

      # 2. 依存関係のインストール
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 3. テストの実行
      # ここで環境変数を注入します
      - name: Run tests
        run: pnpm run test:run # 後述する CI 用のコマンドを実行
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}